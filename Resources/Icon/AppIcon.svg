<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30333b"/>
      <stop offset="1" stop-color="#14161a"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3f48"/>
      <stop offset="1" stop-color="#25282e"/>
    </linearGradient>
    <radialGradient id="glowG"><stop offset="0" stop-color="#3deb7a" stop-opacity=".55"/><stop offset="1" stop-color="#3deb7a" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowR"><stop offset="0" stop-color="#ff5450" stop-opacity=".55"/><stop offset="1" stop-color="#ff5450" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- macOS 아이콘 그리드: 1024 캔버스 안 824 사각형 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="3"/>

  <g stroke="#9a9ea8" stroke-width="8">
    <rect x="232" y="247" width="560" height="150" rx="34" fill="url(#unit)"/>
    <rect x="232" y="437" width="560" height="150" rx="34" fill="url(#unit)"/>
    <rect x="232" y="627" width="560" height="150" rx="34" fill="url(#unit)"/>
  </g>
  <g stroke="#9a9ea8" stroke-width="12" stroke-linecap="round" opacity=".8">
    <path d="M592 322h140M592 512h140M592 702h140"/>
  </g>

  <!-- 전원 LED(초록) 2개 + 활동 LED(빨강) 1개 -->
  <circle cx="312" cy="322" r="70" fill="url(#glowG)"/>
  <circle cx="312" cy="512" r="70" fill="url(#glowG)"/>
  <circle cx="404" cy="512" r="70" fill="url(#glowR)"/>
  <circle cx="312" cy="322" r="28" fill="#3deb7a"/>
  <circle cx="312" cy="512" r="28" fill="#3deb7a"/>
  <circle cx="404" cy="512" r="28" fill="#ff5450"/>
  <circle cx="312" cy="702" r="28" fill="#1a1c20" stroke="#4a4e57" stroke-width="4"/>
  <circle cx="404" cy="702" r="28" fill="#1a1c20" stroke="#4a4e57" stroke-width="4"/>
  <circle cx="404" cy="322" r="28" fill="#1a1c20" stroke="#4a4e57" stroke-width="4"/>
</svg>
